[project]
name = "amu"
version = "0.1.0"
description = "Anti-Messup Agent – scope guardrail for AI code edits (TWC Buildathon 2026, Track 2)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
amu = "amu.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

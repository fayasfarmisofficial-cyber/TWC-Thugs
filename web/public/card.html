<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWC Thugs · amu card</title>
<style>:root{color-scheme:light dark;--fg:#eee;--bg:#111;--m:#d64bd6;--dim:#999;--card:#1c1c1c}@media(prefers-color-scheme:light){:root{--fg:#111;--bg:#fafafa;--dim:#666;--card:#fff}}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,monospace;padding:1.5rem;max-width:1000px;margin:auto}h1{color:var(--m)}textarea{width:100%;min-height:120px;background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:8px;padding:.6rem;font:inherit}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:1rem 0}.tile{background:var(--card);border:1px solid #8884;border-radius:8px;padding:.8rem}.tile b{font-size:1.6rem;display:block}table{width:100%;border-collapse:collapse}td,th{padding:.35rem .5rem;border-bottom:1px solid #8883;text-align:left;vertical-align:top}.badge{display:inline-block;padding:0 .4rem;border-radius:4px;border:1px solid #8886;margin-right:.3rem}.sound{border-color:#3c3}.guessed{border-color:#cc3}.unknown{border-color:#c33}button{background:var(--m);color:#fff;border:0;border-radius:6px;padding:.4rem .8rem;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.dim{color:var(--dim)}pre{background:var(--card);padding:.6rem;border-radius:6px;overflow:auto;max-height:300px}</style></head><body>
<h1>TWC Thugs · amu agent card</h1><p class="dim">Paste the output of <code>amu map --json</code> (or <code>.amu/map.json</code>) below.</p>
<textarea id="in" placeholder='{"root":{...},"nodes":[...],"resolution":{...}}'></textarea>
<p><button onclick="render()">Render</button> <button id="approve" disabled title="enabled only when planner decision is proceed">Approve</button> <button onclick="document.getElementById('raw').hidden=!document.getElementById('raw').hidden">View JSON</button></p>
<div id="out"></div><pre id="raw" hidden></pre>
<script>
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){let m;try{m=JSON.parse(document.getElementById('in').value)}catch(e){alert('not JSON');return}
const r=m.resolution||{},n=m.nodes||[];document.getElementById('raw').textContent=JSON.stringify(m,null,2);
document.getElementById('approve').disabled=(m.planner_decision!=='proceed'&&(m.planner||{}).decision!=='proceed');
let h=`<div class="tiles"><div class="tile"><span class="dim">sound</span><b>${r.sound??0}</b></div><div class="tile"><span class="dim">guessed</span><b>${r.guessed??0}</b></div><div class="tile"><span class="dim">unknown</span><b>${r.unknown??0}</b></div><div class="tile"><span class="dim">ripples</span><b>${(m.ripples||[]).length}</b></div></div>`;
h+=`<p class="dim">${esc(r.qualifier||'')}</p><table><tr><th>id</th><th>node</th><th>badges</th><th>reason</th><th>verify</th><th></th></tr>`;
for(const x of n){h+=`<tr><td>${esc(x.id)}</td><td>${esc(x.path)}${x.symbol?'#'+esc(x.symbol):''}<br><span class="dim">${esc(x.feature)}</span></td><td><span class="badge ${esc(x.confidence)}">${esc(x.confidence)}</span><span class="badge">${esc(x.risk)}</span></td><td>${esc(x.reason)}</td><td><code>${esc(x.verify)}</code></td><td>${x.confidence!=='sound'?`<button onclick="alert('Answer ${esc(x.id)}: run\\n${esc(x.verify)}')">Answer ${esc(x.id)}</button>`:''}</td></tr>`}
h+=`</table><p><b>next</b> <code>${esc(m.next||'')}</code></p>`;document.getElementById('out').innerHTML=h}
</script></body></html>
